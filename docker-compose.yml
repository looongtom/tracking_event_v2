services:
  kafka-zookeeper:
    container_name: kafka-zookeeper
    image: "bitnami/zookeeper:3.8.4"
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    networks:
      - custom_network

  kafka-broker:
    container_name: kafka-brooker
    image: "bitnami/kafka:3.3.2"
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      - KAFKA_BROKER_ID=1
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_ZOOKEEPER_CONNECT=kafka-zookeeper:2181
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CLIENT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_LISTENERS=CLIENT://:9092,EXTERNAL://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=CLIENT://kafka-broker:9092,EXTERNAL://localhost:9093
      - KAFKA_INTER_BROKER_LISTENER_NAME=CLIENT
    depends_on:
      - kafka-zookeeper
    networks:
      - custom_network


  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    networks:
      - custom_network

  receive-event:
    build:
      context: ./receive-event
      dockerfile: Dockerfile
    container_name: receive-event
    ports:
      - "8081:8081"
    depends_on:
      - kafka-broker
    networks:
      - custom_network
    environment:
      - KAFKA_BROKER=kafka-broker:9092
      - KAFKA_TOPIC=tracking-event
      - SERVER_PORT_RECEIVE_EVENT=8081
      - USER_ID=6732cd79d221e70d2025fb2e
      - CLIENT_ID=client2
      - EVENT_NAME=add_to_cart
      - MAX_AMOUNT_EVENT=100
      - TOTAL_STORE=5
      - TOTAL_CLIENT=5
      - TOTAL_EVENT_TYPE=5

  upload-event:
    build:
      context: ./upload-event
      dockerfile: Dockerfile
    container_name: upload-event
    ports:
      - "8083:8083"
    depends_on:
      - kafka-broker
    networks:
      - custom_network
    environment:
      - SERVER_PORT_UPDATE_EVENT=8083
      - DELAY_TIME=500ms

  event-processor-v2:
    build:
      context: ./event-processor-v2
      dockerfile: Dockerfile
    container_name: event-processor-v2
    ports:
      - "8082:8082"
    depends_on:
      - kafka-broker
      - mongo
      - upload-event
    networks:
      - custom_network
    environment:
      - SERVER_PORT_EVENT_PROCESSOR=8082
      - SERVER_UPDATE_EVENT=upload-event
      - SERVER_PORT_UPDATE_EVENT=8083
      - MONGO_URI=mongo:27017
      - MONGO_DB=test
      - MONGO_COLLECTION=tracking_event
      - KAFKA_BROKER=kafka-broker:9092
      - KAFKA_TOPIC=tracking-event
      - KAFKA_GROUP_ID=tracking-event-group
    expose:
      - "8082"



volumes:
  kafka-volume:
  zookeeper-volume:

networks:
  custom_network:
    driver: bridge

