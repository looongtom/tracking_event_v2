  receive-event:
    build:
      context: ./receive-event
      dockerfile: Dockerfile
    container_name: receive-event
    ports:
      - "8081:8081"
    networks:
      - tagfly_backend_net
    environment:
      - KAFKA_BROKER=0.tcp.ap.ngrok.io:15985
      - KAFKA_TOPIC=tracking-event
      - SERVER_PORT_RECEIVE_EVENT=8081
      - USER_ID=6732cd79d221e70d2025fb2e
      - CLIENT_ID=client2
      - EVENT_NAME=add_to_cart
      - MAX_AMOUNT_EVENT=100
      - TOTAL_STORE=5
      - TOTAL_CLIENT=5
      - TOTAL_EVENT_TYPE=5

  mongo:
    image: mongo:7.0
    container_name: mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_DATABASE=tagfly
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=secret
    networks:
      - tagfly_backend_net
    deploy:
      resources:
        limits:
          memory: "130M" # 256 MB of RAM

  event-processor-v2:
    build:
      context: ./event-processor-v2
      dockerfile: Dockerfile
    container_name: event-processor-v2
    ports:
      - "8082:8082"
    depends_on:
      - mongo
    networks:
      - tagfly_backend_net
    environment:
      - SERVER_PORT_EVENT_PROCESSOR=8082
      - SERVER_PORT_UPDATE_EVENT=8083
      - MONGO_COLLECTION=tracking_event
      - KAFKA_BROKER=0.tcp.ap.ngrok.io:15985
      - KAFKA_TOPIC=tracking-event
      - KAFKA_GROUP_ID=tracking-event-group
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=secret
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_DATABASE=tagfly
      - MONGO_URI=mongo:27017
    deploy:
      resources:
        limits:
          memory: "256M" # 256 MB of RAM
    expose:
      - "8082"

networks:
  tagfly_backend_net:
    driver: bridge
